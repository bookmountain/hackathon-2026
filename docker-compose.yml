name: unimap

services:
  db:
    # PostGIS = Postgres + geo types, handy for the "Map" features later. Plain Postgres otherwise.
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unimap}
      POSTGRES_USER: ${POSTGRES_USER:-unimap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unimap}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"   # DBeaver: localhost:5432, db/user/pass = unimap
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    # Catches all outgoing email locally. Inbox UI: http://localhost:8025
    image: axllent/mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=${POSTGRES_DB:-unimap};Username=${POSTGRES_USER:-unimap};Password=${POSTGRES_PASSWORD:-unimap}
      ConnectionStrings__Redis: redis:6379
      Jwt__Key: ${JWT_KEY:-dev-only-signing-key-change-me-please-32+chars}
      R2__AccountId: ${R2_ACCOUNT_ID:-}
      R2__AccessKeyId: ${R2_ACCESS_KEY_ID:-}
      R2__SecretAccessKey: ${R2_SECRET_ACCESS_KEY:-}
      R2__Bucket: ${R2_BUCKET:-}
      R2__PublicBaseUrl: ${R2_PUBLIC_BASE_URL:-}
      # Claude, for photo analysis. Those endpoints return 503 without a key.
      Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}
      # Email: defaults to Mailpit. Point SMTP_* at Resend/Brevo/Gmail in .env to send for real.
      Email__Host: ${SMTP_HOST:-mailpit}
      Email__Port: ${SMTP_PORT:-1025}
      Email__Username: ${SMTP_USERNAME:-}
      Email__Password: ${SMTP_PASSWORD:-}
      Email__Security: ${SMTP_SECURITY:-none}
      Email__From: ${EMAIL_FROM:-UniMap <no-reply@unimap.local>}
      # Uncomment if file changes aren't picked up (some Windows/macOS setups):
      # DOTNET_USE_POLLING_FILE_WATCHER: "true"
    ports:
      - "${API_PORT:-8080}:8080"        # Swagger: http://localhost:8080/swagger
    volumes:
      - ./backend:/src
      # Keep container build output out of the host folder (and vice versa).
      - api-bin:/src/src/UniMap.Api/bin
      - api-obj:/src/src/UniMap.Api/obj
      - nuget:/root/.nuget/packages
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  api-bin:
  api-obj:
  nuget:
